name: ChatOps dispatch

on:
  push:
    branches: [chatops]
    paths:
      - '.chatops/command.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: morgentidende-v3-chatops
  cancel-in-progress: false
  queue: max

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch with short-lived GitHub identity
        run: node scripts/chatops-dispatch.mjs
