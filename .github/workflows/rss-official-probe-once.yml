name: RSS official probe once

on:
  push:
    paths:
      - '.github/workflows/rss-official-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe Danish official RSS endpoints
        run: |
          python - <<'PY'
          import re, html, urllib.request, urllib.parse, urllib.error
          H={'User-Agent':'Mozilla/5.0 Morgentidende RSS Probe','Accept':'text/html,application/rss+xml,application/atom+xml,application/xml,text/xml,*/*'}
          def get(url,limit=1800000):
            req=urllib.request.Request(url,headers=H)
            with urllib.request.urlopen(req,timeout=15) as r:
              return r.status,r.geturl(),r.headers.get('content-type') or '',r.read(limit).decode('utf-8','ignore')
          def isxml(b):
            lo=b.lstrip().lower()
            return '<rss' in lo[:8000] or '<feed' in lo[:8000] or '<rdf:rdf' in lo[:8000] or '<item' in lo[:20000]
          def probe(label,url):
            try:
              st,final,ct,b=get(url,250000)
              print('PROBE',label,st,'XML' if isxml(b) else 'NONXML',ct,final,url)
            except urllib.error.HTTPError as e: print('HTTP',label,e.code,url)
            except Exception as e: print('ERR',label,type(e).__name__,e,url)

          sites={
            'justits':'https://www.justitsministeriet.dk/',
            'uim':'https://uim.dk/',
            'skm':'https://skm.dk/',
            'sum':'https://sum.dk/',
            'sst':'https://www.sst.dk/',
            'politi':'https://politi.dk/',
          }
          for name,url in sites.items():
            print('\n===',name,url,'===')
            try: st,final,ct,b=get(url)
            except Exception as e: print('PAGE_ERR',type(e).__name__,e); continue
            print('PAGE',st,final,ct,'LEN',len(b))
            u=html.unescape(b)
            hints=[]
            patterns=[
              r'<link[^>]+type=["\']application/(?:rss\+xml|atom\+xml)["\'][^>]+href=["\']([^"\']+)',
              r'<link[^>]+href=["\']([^"\']+)["\'][^>]+type=["\']application/(?:rss\+xml|atom\+xml)["\']',
              r'href=["\']([^"\']+)["\'][^>]*(?:class=["\'][^"\']*rss|title=["\'][^"\']*rss|aria-label=["\'][^"\']*rss)',
              r'(?:href|data-url)=["\']([^"\']*(?:\?rss=true|rss=true|/rss|/feed|\.xml)[^"\']*)["\']'
            ]
            for pat in patterns:
              for x in re.findall(pat,u,re.I):
                absu=urllib.parse.urljoin(final,x)
                if absu not in hints: hints.append(absu)
            for x in hints[:40]:
              print('HINT',x)
              probe(name+'_HINT',x)
            # Common high-value news/archive paths and same CMS ?rss=true convention.
            paths=['nyheder','aktuelt','presse','pressemeddelelser','nyheder/nyhedsarkiv','aktuelt/nyheder']
            for p in paths:
              base=urllib.parse.urljoin(final,p.rstrip('/')+'/')
              probe(name+'_COMMON',base+'?rss=true')
          PY
