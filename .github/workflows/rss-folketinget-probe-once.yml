name: RSS Folketinget probe once

on:
  push:
    paths:
      - '.github/workflows/rss-folketinget-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe Folketinget OData Atom and JSON
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, json
          base='https://oda.ft.dk/api/'
          queries=[
            ('Sag-atom','Sag',{'$top':'3','$orderby':'opdateringsdato desc','$format':'atom'}),
            ('Dokument-atom','Dokument',{'$top':'3','$orderby':'opdateringsdato desc','$format':'atom'}),
            ('Dokument-json','Dokument',{'$top':'3','$orderby':'opdateringsdato desc','$format':'json'}),
          ]
          for label,entity,params in queries:
            url=base+entity+'?'+urllib.parse.urlencode(params)
            print('\n===',label,'===')
            print('URL',url)
            req=urllib.request.Request(url,headers={'User-Agent':'Morgentidende/2.0','Accept':'application/atom+xml,application/json,application/xml,text/xml,*/*'})
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                b=r.read(30000).decode('utf-8','replace')
                print('STATUS',r.status,'CT',r.headers.get('content-type'),'FINAL',r.geturl(),'LEN',len(b))
                print('BODY',repr(b[:12000]))
            except Exception as e:
              print('ERR',type(e).__name__,e)
          PY
