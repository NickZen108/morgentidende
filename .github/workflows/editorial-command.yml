name: Editorial command

on:
  push:
    branches: [main]
    paths:
      - '.github/editorial-command.json'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of articles to produce (1-5)'
        required: false
        default: '1'
      instruction:
        description: 'Editorial instruction'
        required: false
        default: 'Produce one current ordinary news article suited to Morgentidende.'
      order_id:
        description: 'Optional existing editorial order ID to run instead of creating new orders'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve command
        id: command
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            COUNT='${{ inputs.count }}'
            INSTRUCTION='${{ inputs.instruction }}'
            ORDER_ID='${{ inputs.order_id }}'
          else
            COUNT=$(jq -r '.count // 1' .github/editorial-command.json)
            INSTRUCTION=$(jq -r '.instruction // "Produce one current ordinary news article suited to Morgentidende."' .github/editorial-command.json)
            ORDER_ID=$(jq -r '.order_id // ""' .github/editorial-command.json)
          fi

          if ! [[ "$COUNT" =~ ^[1-5]$ ]]; then
            echo "count must be an integer from 1 to 5" >&2
            exit 2
          fi

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "order_id=$ORDER_ID" >> "$GITHUB_OUTPUT"
          {
            echo 'instruction<<EOF'
            echo "$INSTRUCTION"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Probe Worker
        env:
          BASE_URL: 'https://morgentidende-v2.nicolaipetersen108.workers.dev'
        shell: bash
        run: |
          set -euo pipefail
          echo 'Worker health:'
          curl --fail-with-body --silent --show-error \
            --connect-timeout 20 --max-time 60 \
            "$BASE_URL/api/health"
          echo

      - name: Run editorial production
        env:
          BASE_URL: 'https://morgentidende-v2.nicolaipetersen108.workers.dev'
          COUNT: '${{ steps.command.outputs.count }}'
          ORDER_ID: '${{ steps.command.outputs.order_id }}'
          INSTRUCTION: '${{ steps.command.outputs.instruction }}'
        shell: bash
        run: |
          set -euo pipefail

          run_order() {
            local id="$1"
            echo "Running editorial order $id"
            curl --fail-with-body --silent --show-error \
              --connect-timeout 20 --max-time 1200 \
              -X POST "$BASE_URL/api/editorial/orders/$id/run" \
              -H 'content-type: application/json' \
              -d '{}'
            echo
          }

          if [ -n "$ORDER_ID" ]; then
            if [ "$COUNT" != "1" ]; then
              echo 'An existing order_id can only be run with count=1.' >&2
              exit 2
            fi
            run_order "$ORDER_ID"
            exit 0
          fi

          for i in $(seq 1 "$COUNT"); do
            echo "Creating editorial order $i/$COUNT"
            payload=$(jq -n --arg instruction "$INSTRUCTION" '{instruction:$instruction}')
            response=$(curl --fail-with-body --silent --show-error \
              --connect-timeout 20 --max-time 60 \
              -X POST "$BASE_URL/api/editorial/orders" \
              -H 'content-type: application/json' \
              -d "$payload")
            id=$(printf '%s' "$response" | jq -r '.order.id // empty')
            if [ -z "$id" ]; then
              echo "Could not read order id from response:" >&2
              echo "$response" >&2
              exit 1
            fi
            run_order "$id"
          done
