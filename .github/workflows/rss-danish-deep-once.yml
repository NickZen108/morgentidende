name: RSS Danish deep once

on:
  push:
    paths:
      - '.github/workflows/rss-danish-deep-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve Erhvervsministeriet and DST RSS endpoints
        run: |
          python - <<'PY'
          import re, html, urllib.request, urllib.parse, urllib.error
          H={'User-Agent':'Mozilla/5.0 Morgentidende RSS Probe','Accept':'text/html,application/rss+xml,application/atom+xml,application/xml,text/xml,*/*'}
          def get(url,limit=2500000):
            req=urllib.request.Request(url,headers=H)
            with urllib.request.urlopen(req,timeout=15) as r:
              return r.status,r.geturl(),r.headers.get('content-type') or '',r.read(limit).decode('utf-8','ignore')
          def probe(label,url):
            try:
              st,final,ct,b=get(url,200000)
              lo=b.lstrip().lower(); xml=('<rss' in lo[:8000] or '<feed' in lo[:8000] or '<rdf:rdf' in lo[:8000] or '<item' in lo[:20000])
              print('PROBE',label,st,'XML' if xml else 'NONXML',ct,final,url)
            except urllib.error.HTTPError as e: print('HTTP',label,e.code,url)
            except Exception as e: print('ERR',label,type(e).__name__,e,url)

          # Erhvervsministeriet: inspect likely list/archive pages for generated RSS hrefs.
          em_pages=['https://www.em.dk/','https://www.em.dk/aktuelt/','https://www.em.dk/aktuelt/nyheder/','https://www.em.dk/nyheder/']
          for page in em_pages:
            print('\n=== EM PAGE',page,'===')
            try: st,final,ct,b=get(page)
            except Exception as e: print('PAGE_ERR',type(e).__name__,e); continue
            print('PAGE',st,final,ct,'LEN',len(b))
            u=html.unescape(b)
            for m in re.findall(r'href=["\']([^"\']+)["\'][^>]*(?:class=["\'][^"\']*rss|title=["\'][^"\']*rss|aria-label=["\'][^"\']*rss)',u,re.I):
              print('EM_RSS_HREF',urllib.parse.urljoin(final,m))
            for m in re.findall(r'(?:href|data-url)=["\']([^"\']*(?:\?rss=true|rss=true|/rss|feed)[^"\']*)["\']',u,re.I):
              print('EM_HINT',urllib.parse.urljoin(final,m))
            # Find archive/list URLs in markup and probe ?rss=true on plausible ones.
            candidates=[]
            for m in re.findall(r'href=["\']([^"\']+)["\']',u,re.I):
              absu=urllib.parse.urljoin(final,m)
              low=absu.lower()
              if 'em.dk' in absu and any(x in low for x in ['/aktuelt','/nyheder','/presse']) and absu not in candidates:
                candidates.append(absu)
            for c in candidates[:20]:
              sep='&' if '?' in c else '?'
              probe('EM_RSS_CAND',c+sep+'rss=true')

          # DST: inspect page source and scripts for exact RSS route/API strings.
          print('\n=== DST DEEP ===')
          page='https://rss.dst.dk/da/'
          st,final,ct,b=get(page,3500000)
          print('DST_PAGE',st,final,ct,'LEN',len(b))
          u=html.unescape(b)
          for pat in [r'href=["\']([^"\']*(?:rss|feed|xml)[^"\']*)["\']',r'https?://[^"\'<> ]+(?:rss|feed|xml)[^"\'<> ]*']:
            for m in re.findall(pat,u,re.I): print('DST_HINT',urllib.parse.urljoin(final,m))
          scripts=[]
          for s in re.findall(r'<script[^>]+src=["\']([^"\']+)',u,re.I):
            su=urllib.parse.urljoin(final,s)
            if su not in scripts: scripts.append(su)
          for su in scripts[:40]:
            try: _,_,_,js=get(su,4000000)
            except Exception: continue
            low=js.lower()
            if 'rss' not in low: continue
            print('DST_SCRIPT_WITH_RSS',su,'LEN',len(js))
            start=0
            for _ in range(12):
              i=low.find('rss',start)
              if i<0: break
              print('DST_CTX',js[max(0,i-500):i+1200].replace('\n',' ')[:1700])
              start=i+3
          # Common query-based variants on real content URLs.
          dst_real=['https://www.dst.dk/da/Statistik/udgivelser?pub=nyt','https://www.dst.dk/da/presse/Pressemeddelelser','https://rss.dst.dk/da/Statistik/udgivelser?pub=nyt','https://rss.dst.dk/da/presse/Pressemeddelelser']
          for c in dst_real:
            for suffix in ['&rss=true' if '?' in c else '?rss=true','&format=rss' if '?' in c else '?format=rss','&output=rss' if '?' in c else '?output=rss']:
              probe('DST_QUERY',c+suffix)
          PY
