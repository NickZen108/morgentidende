name: RSS probe once

on:
  push:
    paths:
      - '.github/workflows/rss-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Parse Nationalbanken RSS metadata
        run: |
          python - <<'PY'
          import re, html, json, urllib.request, urllib.parse, urllib.error
          page='https://www.nationalbanken.dk/da/rss-feeds'
          headers={'User-Agent':'Mozilla/5.0 Morgentidende RSS Probe','Accept':'text/html,application/xml,*/*'}
          req=urllib.request.Request(page,headers=headers)
          with urllib.request.urlopen(req,timeout=15) as r:
            body=r.read(2500000).decode('utf-8','ignore')
          m=re.search(r"<dnb-rss-feeds[^>]+topics='([^']+)'",body,re.I|re.S)
          if not m:
            print('NO_TOPICS_ATTRIBUTE'); raise SystemExit(0)
          raw=html.unescape(m.group(1))
          data=json.loads(raw)
          print('TOPIC_COUNT',len(data))
          urls=[]
          def walk(x,path='root'):
            if isinstance(x,dict):
              for k,v in x.items():
                if isinstance(v,str) and ('http://' in v or 'https://' in v or 'rss' in v.lower() or 'xml' in v.lower()):
                  print('FIELD',path+'.'+k,repr(v[:500]))
                  for u in re.findall(r'https?://[^\s"<>]+',v):
                    u=u.rstrip('.,;)')
                    if u not in urls: urls.append(u)
                walk(v,path+'.'+k)
            elif isinstance(x,list):
              for i,v in enumerate(x): walk(v,f'{path}[{i}]')
          walk(data)
          print('URL_COUNT',len(urls))
          for u in urls:
            print('URL',u)
            if 'nationalbanken.dk' not in u: continue
            try:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 Morgentidende RSS Probe','Accept':'application/rss+xml,application/xml,text/xml,*/*'})
              with urllib.request.urlopen(req,timeout=10) as r:
                b=r.read(100000).decode('utf-8','ignore').lstrip().lower()
                xmlish=('<rss' in b[:5000] or '<feed' in b[:5000] or '<rdf:rdf' in b[:5000] or '<item' in b[:10000] or '<entry' in b[:10000])
                print('PROBE',r.status,'XML' if xmlish else 'NONXML',r.headers.get('content-type'),r.geturl())
            except urllib.error.HTTPError as e: print('PROBE_HTTPERR',e.code,u)
            except Exception as e: print('PROBE_ERROR',type(e).__name__,e,u)
          PY
