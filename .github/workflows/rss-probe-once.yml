name: RSS probe once

on:
  push:
    paths:
      - '.github/workflows/rss-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Discover RSS links on target sites
        run: |
          python - <<'PY'
          import re, urllib.request, urllib.parse

          targets = {
            'nationalbanken': 'https://www.nationalbanken.dk/da/rss-feeds',
            'berlingske': 'https://www.berlingske.dk/',
            'politiken': 'https://politiken.dk/',
            'tv2': 'https://nyheder.tv2.dk/',
          }
          headers={'User-Agent':'Mozilla/5.0 Morgentidende RSS Probe','Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'}
          for name,url in targets.items():
            print('\n===', name, url, '===')
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=15) as r:
                body=r.read(1000000).decode('utf-8','ignore')
                print('STATUS', getattr(r,'status',200), 'FINAL', r.geturl(), 'CT', r.headers.get('content-type'))
            except Exception as e:
              print('FETCH_ERROR', type(e).__name__, e)
              continue
            found=[]
            patterns=[
              r'<link[^>]+(?:type=["\']application/(?:rss\+xml|atom\+xml)["\']|rel=["\']alternate["\'])[^>]+href=["\']([^"\']+)',
              r'<link[^>]+href=["\']([^"\']+)["\'][^>]+(?:type=["\']application/(?:rss\+xml|atom\+xml)["\']|rel=["\']alternate["\'])',
              r'(https?://[^"\'<>\\ ]+(?:rss|feed|\.xml)[^"\'<>\\ ]*)',
              r'(?:href|data-url|data-copy|value)=["\']([^"\']+(?:rss|feed|\.xml)[^"\']*)["\']',
            ]
            for pat in patterns:
              for m in re.findall(pat, body, flags=re.I):
                u=urllib.parse.urljoin(url,m.replace('&amp;','&'))
                if u not in found: found.append(u)
            for u in found[:100]: print('CANDIDATE',u)
          PY
