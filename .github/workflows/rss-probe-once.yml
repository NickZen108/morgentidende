name: RSS probe once

on:
  push:
    paths:
      - '.github/workflows/rss-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe likely Danish RSS endpoints
        run: |
          python - <<'PY'
          import re, urllib.request, urllib.error
          headers={'User-Agent':'Mozilla/5.0 Morgentidende RSS Probe','Accept':'application/rss+xml,application/atom+xml,application/xml,text/xml,text/html,*/*'}
          candidates={
            'politiken':[
              'https://politiken.dk/rss/senestenyt.rss','https://politiken.dk/rss/tophistorier.rss','https://politiken.dk/rss/indland.rss','https://politiken.dk/rss/udland.rss','https://politiken.dk/rss/erhverv.rss','https://politiken.dk/rss/kultur.rss'],
            'berlingske':[
              'https://www.berlingske.dk/rss','https://www.berlingske.dk/feed','https://www.berlingske.dk/rss.xml','https://www.berlingske.dk/section/nyhedsoversigt/&template=rss&mime=xml'],
            'tv2':[
              'https://services.tv2.dk/api/feeds/nyheder/rss','https://nyheder.tv2.dk/rss','https://nyheder.tv2.dk/feed','https://nyheder.tv2.dk/rss.xml'],
          }
          for group,urls in candidates.items():
            print('\n===',group,'===')
            for url in urls:
              try:
                req=urllib.request.Request(url,headers=headers)
                with urllib.request.urlopen(req,timeout=12) as r:
                  body=r.read(100000).decode('utf-8','ignore').lstrip().lower()
                  xmlish=('<rss' in body[:5000] or '<feed' in body[:5000] or '<rdf:rdf' in body[:5000] or '<item' in body[:10000] or '<entry' in body[:10000])
                  print('RESULT',r.status,'XML' if xmlish else 'NONXML',r.headers.get('content-type'),r.geturl(),url)
              except urllib.error.HTTPError as e:
                print('HTTPERR',e.code,url)
              except Exception as e:
                print('ERROR',type(e).__name__,str(e),url)

          # Nationalbanken page: print short contexts around copy-link/RSS data in raw HTML.
          url='https://www.nationalbanken.dk/da/rss-feeds'
          print('\n=== nationalbanken raw contexts ===')
          try:
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=15) as r:
              body=r.read(2000000).decode('utf-8','ignore')
            low=body.lower()
            for needle in ['kopier link','copy link','rssfeed','rss-feed','clipboard','xml']:
              print('\nNEEDLE',needle)
              start=0; n=0
              while n<12:
                i=low.find(needle,start)
                if i<0: break
                print(body[max(0,i-350):i+650].replace('\n',' ')[:1000])
                start=i+len(needle); n+=1
          except Exception as e:
            print('NB_ERROR',type(e).__name__,e)
          PY
