name: RSS deep probe once

on:
  push:
    paths:
      - '.github/workflows/rss-deep-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe exact Nationalbanken RSS API endpoints
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, urllib.error
          topics=['Nyt','Pressemeddelelse','Analyse','Statistiknyhed','Markedsmeddelelse']
          for topic in topics:
            url='https://www.nationalbanken.dk/api/rssfeed?'+urllib.parse.urlencode({'topic':topic,'lang':'da'})
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Morgentidende RSS Probe','Accept':'application/rss+xml,application/xml,text/xml,*/*'})
              with urllib.request.urlopen(req,timeout=15) as r:
                b=r.read(120000).decode('utf-8','ignore').lstrip().lower()
                xmlish=('<rss' in b[:5000] or '<feed' in b[:5000] or '<rdf:rdf' in b[:5000] or '<item' in b[:10000])
                print('RESULT',topic,r.status,'XML' if xmlish else 'NONXML',r.headers.get('content-type'),r.geturl())
            except urllib.error.HTTPError as e:
              print('HTTPERR',topic,e.code,url)
            except Exception as e:
              print('ERROR',topic,type(e).__name__,e,url)
          PY
