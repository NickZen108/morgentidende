name: RSS deep probe once

on:
  push:
    paths:
      - '.github/workflows/rss-deep-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deep probe Nationalbanken and Berlingske
        run: |
          python - <<'PY'
          import re, html, urllib.request, urllib.parse, urllib.error

          H={'User-Agent':'Mozilla/5.0 Morgentidende RSS Deep Probe','Accept':'text/html,application/javascript,application/xml,*/*'}

          def fetch(url, limit=1500000):
            req=urllib.request.Request(url,headers=H)
            with urllib.request.urlopen(req,timeout=15) as r:
              return r.geturl(), r.headers.get('content-type') or '', r.read(limit).decode('utf-8','ignore')

          print('=== NATIONALBANKEN PAGE ===')
          url='https://www.nationalbanken.dk/da/rss-feeds'
          final,ct,body=fetch(url,3000000)
          print('PAGE',final,ct,'LEN',len(body))
          # Print script srcs and dnb-rss-feeds opening tag / topic names.
          scripts=[]
          for s in re.findall(r'<script[^>]+src=["\']([^"\']+)',body,re.I):
            u=urllib.parse.urljoin(url,s)
            if u not in scripts: scripts.append(u)
          print('SCRIPT_COUNT',len(scripts))
          for s in scripts: print('SCRIPT',s)
          m=re.search(r'(<dnb-rss-feeds[^>]+>)',body,re.I|re.S)
          if m:
            tag=html.unescape(m.group(1))
            print('DNB_TAG',tag[:12000])
          # Probe JS bundles for strings around rss-feed component, endpoint paths, fetch calls, /api/, topic param.
          for s in scripts:
            if 'nationalbanken.dk' not in s: continue
            try:
              _,jct,j=fetch(s,5000000)
            except Exception as e:
              print('SCRIPT_ERROR',s,type(e).__name__,e); continue
            low=j.lower()
            if 'rss' not in low: continue
            print('\nSCRIPT_WITH_RSS',s,jct,'LEN',len(j))
            for needle in ['dnb-rss-feeds','rss-feeds','rssfeed','rss-feed','/api/','topic','fetch(']:
              start=0;n=0
              while n<8:
                i=low.find(needle,start)
                if i<0: break
                print('CTX',needle,j[max(0,i-500):i+1200].replace('\n',' ')[:1700])
                start=i+len(needle); n+=1

          print('\n=== BERLINGSKE PAGE / ASSETS ===')
          burl='https://www.berlingske.dk/'
          final,ct,b=fetch(burl,2500000)
          print('PAGE',final,ct,'LEN',len(b))
          # Search direct feed hints and scripts.
          for pat in [r'https?://[^"\'<> ]+(?:rss|feed|\.xml)[^"\'<> ]*', r'href=["\']([^"\']+(?:rss|feed|\.xml)[^"\']*)']:
            for x in re.findall(pat,b,re.I): print('BERLINGSKE_HINT',urllib.parse.urljoin(burl,x))
          bscripts=[]
          for s in re.findall(r'<script[^>]+src=["\']([^"\']+)',b,re.I):
            u=urllib.parse.urljoin(burl,s)
            if u not in bscripts: bscripts.append(u)
          print('BERLINGSKE_SCRIPT_COUNT',len(bscripts))
          for s in bscripts[:50]:
            try:
              _,sct,j=fetch(s,3500000)
            except Exception: continue
            low=j.lower()
            if 'rss' not in low and 'feed' not in low: continue
            for needle in ['rss','feed','xml']:
              start=0;n=0
              while n<5:
                i=low.find(needle,start)
                if i<0: break
                ctx=j[max(0,i-400):i+1000].replace('\n',' ')
                if 'http' in ctx or '/rss' in ctx or 'feed' in ctx.lower():
                  print('BERLINGSKE_CTX',s,needle,ctx[:1400])
                start=i+len(needle); n+=1

          # Try a compact set of historical/common endpoint patterns.
          candidates=[
            'https://www.berlingske.dk/rss/nyheder.xml',
            'https://www.berlingske.dk/rss/seneste.xml',
            'https://www.berlingske.dk/rss/senestenyt.xml',
            'https://www.berlingske.dk/rss/indland.xml',
            'https://www.berlingske.dk/rss/udland.xml',
            'https://www.berlingske.dk/rss/business.xml',
            'https://www.berlingske.dk/rss/kultur.xml',
            'https://www.berlingske.dk/rss/nyheder.rss',
            'https://www.berlingske.dk/rss/seneste.rss',
            'https://www.berlingske.dk/feeds/nyheder',
            'https://www.berlingske.dk/feeds/seneste',
          ]
          for u in candidates:
            try:
              req=urllib.request.Request(u,headers={'User-Agent':H['User-Agent'],'Accept':'application/rss+xml,application/xml,text/xml,*/*'})
              with urllib.request.urlopen(req,timeout=10) as r:
                x=r.read(100000).decode('utf-8','ignore').lstrip().lower()
                xmlish=('<rss' in x[:5000] or '<feed' in x[:5000] or '<rdf:rdf' in x[:5000] or '<item' in x[:10000])
                print('BERLINGSKE_PROBE',r.status,'XML' if xmlish else 'NONXML',r.headers.get('content-type'),r.geturl(),u)
            except urllib.error.HTTPError as e: print('BERLINGSKE_HTTP',e.code,u)
            except Exception as e: print('BERLINGSKE_ERR',type(e).__name__,u)
          PY
