name: RSS EU trade migration energy probe once
on:
  push:
    paths:
      - .github/workflows/rss-eu-trade-migration-energy-probe-once.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          urls={
            'trade-node':'https://policy.trade.ec.europa.eu/node/28/rss_en',
            'trade-newsroom':'https://ec.europa.eu/newsroom/trade/feed?item_type=1053&sub=1&pr=all',
            'migration-node':'https://home-affairs.ec.europa.eu/node/1/rss_en',
            'migration-news':'https://home-affairs.ec.europa.eu/news_en?prefLang=en&etrans=da&_format=rss',
            'energy-node':'https://energy.ec.europa.eu/node/1/rss_en',
            'energy-news':'https://energy.ec.europa.eu/news_en?prefLang=en&etrans=da&_format=rss',
            'climate-node':'https://climate.ec.europa.eu/node/1/rss_en',
            'taxation-node':'https://taxation-customs.ec.europa.eu/node/1/rss_en',
          }
          H={'User-Agent':'Morgentidende/2.0 RSS Probe','Accept':'application/rss+xml,application/atom+xml,application/xml,text/xml,*/*'}
          for name,url in urls.items():
            try:
              req=urllib.request.Request(url,headers=H)
              with urllib.request.urlopen(req,timeout=20) as r:
                b=r.read(300000).decode('utf-8','ignore')
                lo=b.lstrip().lower()
                feed=(('<rss' in lo[:12000] and '<item' in lo) or ('<feed' in lo[:12000] and '<entry' in lo) or ('<rdf:rdf' in lo[:12000] and '<item' in lo))
                entries=lo.count('<item')+lo.count('<entry')
                print('RESULT',name,r.status,'FEED' if feed else 'NONFEED','ENTRIES',entries,'CT',r.headers.get('content-type'),'LEN',len(b),'FINAL',r.geturl())
            except urllib.error.HTTPError as e:
              print('HTTP',name,e.code,url)
            except Exception as e:
              print('ERR',name,type(e).__name__,e,url)
          PY
