name: RSS UIM inspect once

on:
  push:
    paths:
      - '.github/workflows/rss-uim-inspect-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect UIM XML responses
        run: |
          python - <<'PY'
          import urllib.request, urllib.error
          urls=[
            'https://uim.dk/nyheder/?rss=true',
            'https://uim.dk/aktuelt/?rss=true',
            'https://uim.dk/pressemeddelelser/?rss=true'
          ]
          for u in urls:
            print('\nURL',u)
            try:
              r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Accept':'application/rss+xml,application/xml,text/xml,*/*'}),timeout=15)
              b=r.read(8000).decode('utf-8','replace')
              print('STATUS',r.status,'CT',r.headers.get('content-type'),'FINAL',r.geturl(),'LEN_READ',len(b))
              print('BODY',repr(b[:3000]))
            except Exception as e: print('ERR',type(e).__name__,e)
          PY
