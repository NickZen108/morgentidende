name: RSS law and hearings probe once

on:
  push:
    paths:
      - '.github/workflows/rss-rets-hoering-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Retsinformation and Høringsportalen feeds
        run: |
          python - <<'PY'
          import urllib.request, urllib.error
          urls={
            'retsinformation':'https://www.retsinformation.dk/eli/eli-update-feed.atom',
            'hoering-all':'https://hoeringsportalen.dk/syndication/HearingsFeed',
            'hoering-politi':'https://hoeringsportalen.dk/syndication/HearingsByFormAreaFeed?formAreaId=19',
            'hoering-retspleje':'https://hoeringsportalen.dk/syndication/HearingsByFormAreaFeed?formAreaId=20',
            'hoering-samfund':'https://hoeringsportalen.dk/syndication/HearingsByFormAreaFeed?formAreaId=4',
            'hoering-skat':'https://hoeringsportalen.dk/syndication/HearingsByFormAreaFeed?formAreaId=15',
            'hoering-sundhed':'https://hoeringsportalen.dk/syndication/HearingsByFormAreaFeed?formAreaId=12',
            'hoering-udlaendinge':'https://hoeringsportalen.dk/syndication/HearingsByFormAreaFeed?formAreaId=37',
            'hoering-erhverv':'https://hoeringsportalen.dk/syndication/HearingsByFormAreaFeed?formAreaId=16',
          }
          H={'User-Agent':'Morgentidende/2.0 RSS Probe','Accept':'application/atom+xml,application/rss+xml,application/xml,text/xml,*/*'}
          for name,url in urls.items():
            try:
              req=urllib.request.Request(url,headers=H)
              with urllib.request.urlopen(req,timeout=20) as r:
                b=r.read(250000).decode('utf-8','ignore')
                lo=b.lstrip().lower()
                feed=('<feed' in lo[:10000] and '<entry' in lo) or ('<rss' in lo[:10000] and '<item' in lo)
                entries=lo.count('<entry')+lo.count('<item')
                print('RESULT',name,r.status,'FEED' if feed else 'NONFEED','ENTRIES',entries,'CT',r.headers.get('content-type'),'LEN',len(b),'FINAL',r.geturl())
            except urllib.error.HTTPError as e:
              print('HTTP',name,e.code,url)
            except Exception as e:
              print('ERR',name,type(e).__name__,e,url)
          PY
