name: RSS cleanup once

on:
  push:
    paths:
      - '.github/workflows/rss-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply audit-backed RSS cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/editorial/feeds.ts')
          s=p.read_text()
          # Nationalbanken configured endpoint returned HTTP 404 in the full audit.
          s='\n'.join(line for line in s.splitlines() if 'f("nationalbanken-news"' not in line) + '\n'
          # Prefer NASA's current official News Releases feed advertised on NASA's RSS page.
          s=s.replace('https://www.nasa.gov/rss/dyn/breaking_news.rss','https://www.nasa.gov/news-release/feed/')
          p.write_text(s)

          d=Path('docs/rss-feed-verification.md')
          t=d.read_text()
          t += '''\n\n## Full endpoint audit 2026-09-05\n\nA GitHub-hosted live audit requested every configured endpoint and inspected the returned body for RSS/Atom/XML structure. Before cleanup there were 114 configured endpoints:\n\n- 105 returned parseable RSS/Atom/XML directly (HTTP 200).\n- 7 were blocked or rate-limited to the audit runner (403/429), so this audit alone does not classify them as dead: Euractiv, Human Progress, IEA, Jihad Watch, FrontPage Magazine, NASA legacy feed, Carbon Brief.\n- TV 2's configured feed had a DNS-resolution failure from the GitHub runner, but independent current feed-reader evidence still shows fresh TV 2 items from that endpoint; keep it provisionally and continue monitoring.\n- Danmarks Nationalbank's configured `https://www.nationalbanken.dk/api/rss/nyheder` returned HTTP 404 and has therefore been removed from the active registry until the exact current XML endpoint is identified. Nationalbanken's official RSS catalogue confirms that feeds exist, but the individual URLs are not exposed reliably in our current retrieval.\n- NASA's legacy `rss/dyn/breaking_news.rss` was rate-limited in the audit. The registry now uses NASA's current official News Releases feed `https://www.nasa.gov/news-release/feed/`, which NASA's current RSS directory advertises.\n- Politico Europe returned HTTP 200 `application/rss+xml` in the live audit.\n- All 10 configured Nature feeds returned HTTP 200 RSS.\n- All 12 configured Frontiers feeds returned HTTP 200 XML.\n- All configured Medical Xpress and Phys.org feeds returned HTTP 200 XML.\n\nAfter removal of the invalid Nationalbanken entry, the active registry contains 113 endpoints.\n'''
          d.write_text(t)
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/editorial/feeds.ts docs/rss-feed-verification.md
          git commit -m 'Clean up RSS registry after full endpoint audit'
          git push
